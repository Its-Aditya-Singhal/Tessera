<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock chat</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #thread {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .turn {
        margin: 8px 0;
        padding: 8px 12px;
        border-radius: 8px;
      }
      [data-role='user'] {
        background: #eef;
      }
      [data-role='assistant'] {
        background: #f4f4f4;
      }
      #composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #ccc;
      }
      #composer .editor,
      #composer textarea {
        flex: 1;
        min-height: 60px;
        border: 1px solid #aaa;
        padding: 6px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <div id="thread" aria-label="Conversation"></div>
    <form id="composer"></form>
    <script src="./mock.js"></script>
  </body>
</html>
